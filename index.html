<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>AI Scanner Pro — прототип</title><style>body{font-family:system-ui;background:#111827;color:#f9fafb;margin:0;padding:18px}main{max-width:600px;margin:auto}video,canvas{width:100%;border-radius:12px;background:#000}button,select{padding:12px;margin:6px 4px 6px 0;border:0;border-radius:9px;font-size:16px}button{background:#38bdf8;color:#082f49;font-weight:bold}p{line-height:1.5}.muted{color:#cbd5e1}#status{padding:12px;background:#1f2937;border-radius:9px}</style></head><body><main><h1>AI Scanner Pro</h1><p class="muted">Безкоштовний прототип камери для графіків. Це ще не AI-прогнозувач.</p><video id="video" autoplay playsinline muted></video><p><button id="start">Увімкнути камеру</button><button id="scan" disabled>Сканувати</button></p><label>Експірація: <select id="expiry"><option>2 хв</option><option selected>3 хв</option><option>5 хв</option></select></label><p id="status">Камера вимкнена. Для доступу потрібен HTTPS або localhost.</p><canvas id="capture" hidden></canvas><p><a id="save" download="chart-scan.png" hidden style="color:#7dd3fc">Зберегти знімок графіка</a></p><p class="muted">Жодні знімки не надсилаються на сервер. Для прогнозів потрібна окрема перевірена модель або алгоритм.</p></main><script>const video=document.querySelector('#video'),scan=document.querySelector('#scan'),status=document.querySelector('#status'),canvas=document.querySelector('#capture'),save=document.querySelector('#save');let stream;document.querySelector('#start').onclick=async()=>{try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;scan.disabled=false;status.textContent='Камера працює. Наведіть її на графік і натисніть «Сканувати».'}catch(e){status.textContent='Не вдалося відкрити камеру: '+e.message+' Перевірте HTTPS і дозвіл камери.'}};scan.onclick=()=>{if(!video.videoWidth){status.textContent='Зачекайте, поки камера завантажиться.';return}canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);canvas.hidden=false;canvas.toBlob(blob=>{if(save.dataset.url)URL.revokeObjectURL(save.dataset.url);save.dataset.url=URL.createObjectURL(blob);save.href=save.dataset.url;save.hidden=false},'image/png');status.textContent='Знімок зроблено. Експірація: '+document.querySelector('#expiry').value+'. AI-аналіз ще не підключений.'};</script></body></html>
